21267573","cat":"Pessoas","title":"Renúncia Ernesto","owner":"Time Solubio","deadline":"Imediato","status":"Em andamento","current":"Ernesto solicitou formalmente para deixar o cargo de CEO (15.06)","next":"Definir data para anúncio de renúncia à companhia","comments":""},{"id":"NEW-1778521627601","cat":"Project Fitbit","title":"Bloqueio de caixa","owner":"Time Solubio","deadline":"Imediato","status":"Em andamento","current":"Ação extrajudicial de Maurício gerou bloqueio de caixa no BB","next":"","comments":""},{"id":"NEW-1779732301009","cat":"Daily Ops","title":"KS","owner":"Time Solubio","deadline":"Imediato","status":"Em andamento","current":"Contração de linha de crédito junto a KS de R$10m","next":"Definir data para convocação de Conselho","comments":""},{"id":"NEW-1779743016078","cat":"Project Fitbit","title":"Postergação pagamento Black Partners","owner":"Time Solubio","deadline":"Imediato","status":"Em andamento","current":".","next":"","comments":""}];
const DEFAULT_OVERVIEW={"kpis":[{"label":"FATURAMENTO YTD","value":"R$21.2m","sub":"vs R$44.4m em 2025","accent":"accent-teal"},{"label":"EBITDA April","value":"-R$18.1m","sub":"Budget: R$43.9m run rate","accent":"accent-navy"},{"label":"CAIXA ATUAL","value":"R$16.8m","sub":"Fornec. bloqueados: R$0.0m","accent":"accent-blue"},{"label":"BUDGET 2026","value":"R$43.9m","sub":"EBITDA Run Rate","accent":"accent-sky"}],"keyPriorities":[{"text":"Ratificar AFAC","cat":"Daily Ops"},{"text":"Bicycle — SHA e SPA","cat":"Bicycle"},{"text":"Oura — conclusão renegociação Integration","cat":"Daily Ops"},{"text":"Liquidez crítica — aguardar aprovação BB (prazo 13/07)","cat":"Project Fitbit"}],"headerDate":"16 JUN 2026"};

let data=[],ovState=JSON.parse(JSON.stringify(DEFAULT_OVERVIEW));
let activeCat="Overview",activeSt="Todos",viewingId=null;
let saveTimeout=null,pendingSave=false,saveInFlight=false,pollTimer=null;

// ── GIST API (direto, sem intermediário) ──────────────────────────────────────
const API = `https://api.github.com/gists/${GIST_ID}`;
const HEADERS = {
  "Authorization": "token " + GIST_TOKEN,
  "Accept": "application/vnd.github.v3+json",
  "Content-Type": "application/json"
};

async function loadFromCloud(){
  setSyncStatus("saving","⟳ Carregando...");
  try{
    const r=await fetch(API,{headers:HEADERS,cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const json=await r.json();
    const content=json.files[GIST_FILE]?.content;
    if(!content) throw new Error("arquivo vazio");
    const rec=JSON.parse(content);
    if(rec.__items){data=rec.__items;if(rec.__overview)ovState=Object.assign(ovState,rec.__overview);}
    else if(Array.isArray(rec)){data=rec;}
    else throw new Error("formato inválido");
    setSyncStatus("ok","✓ Sincronizado");
  }catch(e){
    console.warn("Offline:",e.message);
    data=JSON.parse(JSON.stringify(DEFAULT_DATA));
    ovState=JSON.parse(JSON.stringify(DEFAULT_OVERVIEW));
    setSyncStatus("error","⚠ Offline — dados locais");
  }
  finishInit();
}

async function saveToCloud(){
  pendingSave=true;
  setSyncStatus("saving","⟳ Salvando...");
  clearTimeout(saveTimeout);
  saveTimeout=setTimeout(async()=>{
    saveInFlight=true;
    try{
      const r=await fetch(API,{
        method:"PATCH",
        headers:HEADERS,
        body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify({__items:data,__overview:ovState},null,2)}}})
      });
      if(!r.ok) throw new Error("HTTP "+r.status);
      setSyncStatus("ok","✓ Salvo");
    }catch(e){
      console.error("Erro ao salvar:",e);
      setSyncStatus("error","⚠ Erro ao salvar");
    }finally{saveInFlight=false;pendingSave=false;}
  },800);
}

function isUserBusy(){
  if(["view-overlay","edit-overlay","confirm-overlay"].some(id=>{const e=document.getElementById(id);return e&&e.style.display==="flex"})) return true;
  if(document.getElementById("date-input-wrap").style.display==="block") return true;
  return document.activeElement&&document.activeElement.isContentEditable;
}

async function pollFromCloud(){
  if(pendingSave||saveInFlight||isUserBusy()) return;
  try{
    const r=await fetch(API,{headers:HEADERS,cache:"no-store"});
    if(!r.ok) return;
    const json=await r.json();
    const content=json.files[GIST_FILE]?.content;
    if(!content) return;
    const rec=JSON.parse(content);
    const remoteItems=rec.__items||(Array.isArray(rec)?rec:null);
    if(!remoteItems) return;
    const remoteStr=JSON.stringify({__items:remoteItems,__overview:rec.__overview||ovState});
    const localStr=JSON.stringify({__items:data,__overview:ovState});
    if(remoteStr===localStr) return;
    data=remoteItems;
    if(rec.__overview) ovState=Object.assign(ovState,rec.__overview);
    document.getElementById("date-display").textContent=ovState.headerDate;
    if(activeCat==="Overview")renderOverview();else render();
    setSyncStatus("ok","✓ Atualizado");
  }catch(e){}
}

function startAutoRefresh(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer=setInterval(pollFromCloud,POLL_MS);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)pollFromCloud();});
  window.addEventListener("focus",pollFromCloud);
}

function exportJSON(){
  const blob=new Blob([JSON.stringify({__items:data,__overview:ovState},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="solubio_"+ovState.headerDate.replace(/ /g,"_")+".json";a.click();
}
function importJSON(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const rec=JSON.parse(ev.target.result);
      if(rec.__items)data=rec.__items;
      if(rec.__overview)ovState=Object.assign(ovState,rec.__overview);
      saveToCloud();
      document.getElementById("date-display").textContent=ovState.headerDate;
      if(activeCat==="Overview")renderOverview();else render();
    }catch(err){setSyncStatus("error","⚠ JSON inválido");}
  };
  reader.readAsText(file);e.target.value="";
}

function setSyncStatus(type,msg){
  const el=document.getElementById("sync-status");
  const s={ok:"background:rgba(46,174,106,.15);color:#1A6B3C",saving:"background:rgba(59,130,246,.15);color:#1D4ED8",error:"background:rgba(219,82,29,.15);color:#A02B1A"};
  el.style.cssText="font-size:11px;padding:5px 11px;border-radius:8px;font-weight:600;display:flex;align-items:center;gap:5px;"+s[type];
  el.textContent=msg;
}

function toggleDateEdit(){
  document.getElementById("date-wrap").style.display="none";
  const w=document.getElementById("date-input-wrap");w.style.display="block";
  const i=document.getElementById("date-input");i.value=ovState.headerDate;i.focus();i.select();
}
function saveDateEdit(){
  const v=document.getElementById("date-input").value.trim();
  if(v){ovState.headerDate=v.toUpperCase();saveToCloud();}
  document.getElementById("date-display").textContent=ovState.headerDate;
  document.getElementById("date-input-wrap").style.display="none";
  document.getElementById("date-wrap").style.display="flex";
}

function finishInit(){
  document.getElementById("date-display").textContent=ovState.headerDate;
  document.getElementById("f-cat").innerHTML=CATS.map(c=>`<option>${c}</option>`).join("");
  buildTabs();buildFilterBtns();setTab("Overview");startAutoRefresh();
}
function buildTabs(){
  document.getElementById("tabs-inner").innerHTML=["Overview",...CATS].map(c=>
    `<button class="tab${c===activeCat?" active":""}" onclick="setTab('${c}')">${c}</button>`).join("");
}
function buildFilterBtns(){
  document.getElementById("filter-btns").innerHTML=["Todos","Em andamento","Concluído","On Hold"].map(s=>{
    const a=s===activeSt,m=STATUS_META[s];
    return`<button class="fbtn" onclick="setSt('${s}')" style="background:${a?(m?m.dot:"#003D4C"):"#fff"};color:${a?"#fff":"#555"};border-color:${a?"transparent":"#CCD8DE"}">${s}</button>`;
  }).join("");
}
function pill(st){const m=STATUS_META[st]||STATUS_META["Em andamento"];return`<span class="pill" style="background:${m.bg};color:${m.color};border:1px solid ${m.border}"><span class="pill-dot" style="background:${m.dot}"></span>${st}</span>`;}
function setTab(c){
  activeCat=c;buildTabs();
  const ov=c==="Overview";
  document.getElementById("overview-wrap").style.display=ov?"block":"none";
  document.getElementById("grid-wrap").style.display=ov?"none":"block";
  document.getElementById("filters").style.display=ov?"none":"flex";
  document.getElementById("btn-new").style.display=ov?"none":"";
  ov?renderOverview():render();
}
function setSt(s){activeSt=s;buildFilterBtns();render();}

function renderOverview(){
  document.getElementById("s-total").textContent=data.length;
  document.getElementById("s-and").textContent=data.filter(d=>d.status==="Em andamento").length;
  document.getElementById("s-conc").textContent=data.filter(d=>d.status==="Concluído").length;
  document.getElementById("s-hold").textContent=data.filter(d=>d.status==="On Hold").length;
  document.getElementById("kpi-grid").innerHTML=ovState.kpis.map((k,i)=>`
    <div class="kpi-card ${k.accent}">
      <span class="kpi-edit-hint">clique para editar</span>
      <div class="kpi-label" contenteditable="true" onblur="saveKpi(${i},'label',this.textContent)">${esc(k.label)}</div>
      <div class="kpi-value-wrap"><div class="kpi-value" contenteditable="true" onblur="saveKpi(${i},'value',this.textContent)">${esc(k.value)}</div></div>
      <div class="kpi-sub" contenteditable="true" onblur="saveKpi(${i},'sub',this.textContent)">${esc(k.sub)}</div>
    </div>`).join("");
  renderPriorityList();renderCatProgress();
}
function renderCatProgress(){
  const ac=new Set(ovState.keyPriorities.map(p=>typeof p==="string"?null:p.cat).filter(Boolean));
  document.getElementById("cat-progress").innerHTML=CATS.map(cat=>{
    const items=data.filter(d=>d.cat===cat);if(!items.length)return"";
    const done=items.filter(d=>d.status==="Concluído").length;
    const pct=Math.round(done/items.length*100);
    return`<div class="cat-progress-item${ac.has(cat)?" has-priority":""}">
      <div class="cat-progress-header">
        <span class="cat-progress-name">${ac.has(cat)?'<span class="cat-priority-dot"></span>':""} ${cat}</span>
        <span class="cat-progress-counts">${done}/${items.length} concluídos</span>
      </div>
      <div class="cat-progress-bar"><div class="cat-progress-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join("");
}
function renderPriorityList(){
  document.getElementById("key-priorities-grid").innerHTML=ovState.keyPriorities.map((p,i)=>`
    <div class="priority-item">
      <div class="priority-num">${i+1}</div>
      <div class="priority-text" contenteditable="true" onblur="savePriorityText(${i},this.textContent)">${esc(p.text||p)}</div>
      <select class="priority-cat-select" onchange="savePriorityCat(${i},this.value)">
        <option value="">— cat</option>
        ${CATS.map(c=>`<option value="${c}"${(p.cat||"")==c?" selected":""}>${c}</option>`).join("")}
      </select>
      <button class="priority-del" onclick="deletePriority(${i})">✕</button>
    </div>`).join("");
}
function saveKpi(i,f,v){ovState.kpis[i][f]=v.trim();saveToCloud();renderOverview();}
function savePriorityText(i,v){
  if(typeof ovState.keyPriorities[i]==="string")ovState.keyPriorities[i]={text:v.trim(),cat:""};
  else ovState.keyPriorities[i].text=v.trim();
  saveToCloud();renderCatProgress();
}
function savePriorityCat(i,v){
  if(typeof ovState.keyPriorities[i]==="string")ovState.keyPriorities[i]={text:ovState.keyPriorities[i],cat:v};
  else ovState.keyPriorities[i].cat=v;
  saveToCloud();renderCatProgress();
}
function addPriority(){
  ovState.keyPriorities.push({text:"Nova prioridade",cat:""});
  saveToCloud();renderOverview();
  setTimeout(()=>{const items=document.getElementById("key-priorities-grid").querySelectorAll(".priority-text");if(items.length){items[items.length-1].focus();document.execCommand("selectAll");}},50);
}
function deletePriority(i){ovState.keyPriorities.splice(i,1);saveToCloud();renderOverview();}

function render(){
  const q=document.getElementById("search").value.toLowerCase().trim();
  const filtered=data.filter(d=>d.cat===activeCat&&(activeSt==="Todos"||d.status===activeSt)&&(!q||[d.title,d.owner,d.current].join(" ").toLowerCase().includes(q)));
  document.getElementById("s-total").textContent=data.length;
  document.getElementById("s-and").textContent=data.filter(d=>d.status==="Em andamento").length;
  document.getElementById("s-conc").textContent=data.filter(d=>d.status==="Concluído").length;
  document.getElementById("s-hold").textContent=data.filter(d=>d.status==="On Hold").length;
  document.getElementById("count").textContent=filtered.length+" itens";
  document.getElementById("grid").innerHTML=filtered.map(item=>`
    <div class="card" onclick="openView('${item.id.replace(/'/g,"\\'")}')">
      <div class="card-top">
        <div class="card-meta"><span class="card-cat">${esc(item.cat)}</span>${pill(item.status)}</div>
        <div class="card-title">${esc(item.title)}</div>
        <div class="card-current">${esc(item.current)}</div>
      </div>
      ${item.next?`<div class="card-next"><div class="card-next-lbl">Next step</div><div class="card-next-txt">${esc(item.next)}</div></div>`:""}
      <div class="card-foot">
        <span class="card-owner">${esc(item.owner)}</span>
        <div class="card-foot-right">
          <span class="deadline-badge">${esc(item.deadline)}</span>
          <button class="edit-btn" onclick="event.stopPropagation();openEdit('${item.id.replace(/'/g,"\\'")}')">Editar</button>
        </div>
      </div>
    </div>`).join("");
}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function openView(id){
  viewingId=id;const d=data.find(x=>x.id===id);if(!d)return;

  document.getElementById("v-pill").innerHTML=pill(d.status);

  document.getElementById("v-owner").textContent=d.owner;
  document.getElementById("v-deadline").textContent=d.deadline;

}
function updateSaveBtn(){
  const ok=document.getElementById("f-title").value.trim()&&document.getElementById("f-owner").value.trim()&&document.getElementById("f-current").value.trim();
  const btn=document.getElementById("btn-save");btn.style.background=ok?"#003D4C":"#CCD8DE";btn.style.cursor=ok?"pointer":"not-allowed";
}
document.addEventListener("input",e=>{if(["f-title","f-owner","f-current"].includes(e.target.id))updateSaveBtn();});
function saveItem(){
  const id=document.getElementById("f-id").value;
  const form={id,cat:document.getElementById("f-cat").value,title:document.getElementById("f-title").value.trim(),owner:document.getElementById("f-owner").value.trim(),deadline:document.getElementById("f-deadline").value.trim()||"Imediato",status:document.getElementById("f-status").value,current:document.getElementById("f-current").value.trim(),next:document.getElementById("f-next").value.trim(),comments:document.getElementById("f-comments").value.trim()};
  if(!form.title||!form.owner||!form.current)return;
  const idx=data.findIndex(d=>d.id===id);
  if(idx>=0)data[idx]=form;else data.push(form);
  saveToCloud();document.getElementById("edit-overlay").style.display="none";
  if(activeCat==="Overview")renderOverview();else render();
}
function confirmDelete(){document.getElementById("view-overlay").style.display="none";document.getElementById("confirm-overlay").style.display="flex";}
function closeConfirm(e){if(e.target===document.getElementById("confirm-overlay"))document.getElementById("confirm-overlay").style.display="none";}
function deleteItem(){
  data=data.filter(d=>d.id!==viewingId);saveToCloud();
  document.getElementById("confirm-overlay").style.display="none";
  if(activeCat==="Overview")renderOverview();else render();
}

loadFromCloud();
</script>
</body>
</html>
